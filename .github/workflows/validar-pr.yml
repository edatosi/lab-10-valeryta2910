name: Validar PR

# Se ejecuta al abrir o editar el PR. Solo REVISA: no comenta ni cambia nada, así que
# funciona también con los Pull Requests que vienen de un fork (token de solo lectura).
on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Título y descripción los escribe el estudiante: se pasan por variables de
    # entorno y NUNCA se insertan con ${{ }} dentro del script (inyección de comandos).
    env:
      TITULO: ${{ github.event.pull_request.title }}
      DESCRIPCION: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar título, nombre, descripción y captura de pantalla
        run: python3 .github/scripts/validar_pr.py
